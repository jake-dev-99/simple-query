name: Verify

# Verifies a change before it lands on main: runs on every PR
# targeting main and on every direct push to main (which only
# happens via the "Cut Release" workflow's bot bypass — covered
# for safety so any tag-firing commit has been gated).
# Single-branch model: feature branches PR directly into main,
# releases are cut via the "Cut Release" workflow which tags +
# triggers the "Deploy" workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual override for re-running the gate against a specific ref
  # (e.g. after a flaky external dep stabilizes).
  workflow_dispatch:

jobs:
  package-tests:
    name: Analyze + test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/simple_query
          - packages/simple_query_platform_interface
          - packages/simple_query_android
          - packages/simple_query_ios
          - packages/simple_query_macos
          - packages/simple_query_linux
          - packages/simple_query_windows
          - packages/simple_query_shared

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ matrix.package }}
        # invalid_dependency warning on path-overrides between
        # federated platform packages is expected during
        # pre-publish development; drop warning fatality so it
        # doesn't block the gate.
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        working-directory: ${{ matrix.package }}
        # Several of the platform packages are native-surface-only
        # with no Dart tests. Tolerate missing test/ rather than
        # fail, mirroring simple-telephony's CI pattern.
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory — skipping."
          fi

      # Note: validate-publishability dry-run + pigeon-drift jobs are
      # intentionally omitted in this Phase A revision. Both depend on
      # tooling/state that lives only on develop (the path→hosted dep
      # split lives in pubspec_overrides.yaml on develop; tool/regen_pigeon.sh
      # is develop-only). They land via the develop→main bridge merge in
      # Phase B and the steps come back automatically.

