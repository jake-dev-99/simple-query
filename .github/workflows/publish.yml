name: Publish to pub.dev

# Triggered by tag pushes on `main` matching one of the eight
# federated packages' tag prefixes. Each package has its own
# tag pattern so a release event publishes exactly one package
# at a time — consistent with pub.dev's automated-publishing
# contract (one tag pattern per package registration).
#
# Tag examples:
#   simple_query-v0.3.0
#   simple_query_android-v0.3.0
#   simple_query_platform_interface-v0.3.0
#
# See docs/RELEASE.md for the cut-a-release runbook + the
# required one-time pub.dev "Automated publishing" setup per
# package.
#
# Two triggers, both needed:
#
#   push: tags — still wired so a manually-pushed tag (human-
#     cut release) publishes without extra steps.
#
#   workflow_dispatch — auto-tag runs on main merges, creates
#     tags, and pushes them with the default GITHUB_TOKEN.
#     GitHub suppresses `push: tags` workflow triggers when the
#     pusher is the runner's own token (anti-infinite-loop),
#     so without this entrypoint every auto-tag landed without
#     a publish run. auto-tag now calls
#     `gh workflow run publish.yml -f tag=<tag>` per new tag;
#     workflow_dispatch is the one event that *does* fire from
#     GITHUB_TOKEN.
on:
  push:
    tags:
      # GitHub Actions uses glob syntax here (not regex); the
      # verify-version step validates the exact semver.
      - 'simple_query-v*'
      - 'simple_query_platform_interface-v*'
      - 'simple_query_android-v*'
      - 'simple_query_ios-v*'
      - 'simple_query_macos-v*'
      - 'simple_query_linux-v*'
      - 'simple_query_windows-v*'
      - 'simple_query_shared-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Package tag to publish (e.g. simple_query_android-v0.3.1)'
        required: true
        type: string

jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: simple_query
            path: packages/simple_query
          - name: simple_query_platform_interface
            path: packages/simple_query_platform_interface
          - name: simple_query_android
            path: packages/simple_query_android
          - name: simple_query_ios
            path: packages/simple_query_ios
          - name: simple_query_macos
            path: packages/simple_query_macos
          - name: simple_query_linux
            path: packages/simple_query_linux
          - name: simple_query_windows
            path: packages/simple_query_windows
          - name: simple_query_shared
            path: packages/simple_query_shared

    # Per-step `if:` rather than job-level: GitHub Actions
    # evaluates job-level `if:` before matrix expansion, so
    # `matrix.package.name` can't be referenced there.
    steps:
      # Normalise tag source across `push` (GITHUB_REF) and
      # `workflow_dispatch` (input). Subsequent steps gate on
      # the resolved tag so both trigger paths work with one
      # set of conditions.
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            ref="refs/tags/$tag"
          else
            tag="${GITHUB_REF#refs/tags/}"
            ref="$GITHUB_REF"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: startsWith(steps.resolve.outputs.tag, format('{0}-v', matrix.package.name))
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      # Flutter plugin packages (pubspec pins `sdk: flutter`), so
      # `dart pub` can't resolve — pub reports:
      #   "Because <pkg> requires the Flutter SDK, version solving
      #    failed. Flutter users should use `flutter pub` instead
      #    of `dart pub`."
      # Use the Flutter toolchain and call `flutter pub ...`
      # throughout. pub.dev's OIDC publish works identically.
      - uses: subosito/flutter-action@v2
        if: startsWith(steps.resolve.outputs.tag, format('{0}-v', matrix.package.name))
        with:
          channel: stable

      - name: Install dependencies
        if: startsWith(steps.resolve.outputs.tag, format('{0}-v', matrix.package.name))
        working-directory: ${{ matrix.package.path }}
        run: flutter pub get

      - name: Verify pubspec version matches tag
        if: startsWith(steps.resolve.outputs.tag, format('{0}-v', matrix.package.name))
        working-directory: ${{ matrix.package.path }}
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          expected="${tag#${{ matrix.package.name }}-v}"
          actual="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag ${tag} does not match pubspec version ${actual} (expected ${expected})"
            exit 1
          fi

      - name: Publish
        if: startsWith(steps.resolve.outputs.tag, format('{0}-v', matrix.package.name))
        working-directory: ${{ matrix.package.path }}
        run: flutter pub publish --force
