name: Publish to pub.dev

# Triggered by tag pushes on `main` matching one of the federated
# packages' tag prefixes. Tags are created by `release.yml`
# (workflow_dispatch). There is no auto-tag step; tags only exist
# when a human deliberately cuts one. This eliminates the orphan-tag
# drift class that plagued the previous auto-tag.yml flow.
#
# Each `publish-*` job uses the canonical
# `dart-lang/setup-dart/.github/workflows/publish.yml@v1` reusable
# workflow, which handles OIDC token exchange with pub.dev.

on:
  push:
    tags:
      - 'simple_query-v*'
      - 'simple_query_platform_interface-v*'
      - 'simple_query_android-v*'
      - 'simple_query_ios-v*'
      - 'simple_query_macos-v*'
      - 'simple_query_linux-v*'
      - 'simple_query_windows-v*'
      - 'simple_query_shared-v*'

jobs:
  publish-facade:
    if: startsWith(github.ref, 'refs/tags/simple_query-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_query

  publish-platform-interface:
    if: startsWith(github.ref, 'refs/tags/simple_query_platform_interface-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_query_platform_interface

  publish-android:
    if: startsWith(github.ref, 'refs/tags/simple_query_android-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_query_android

  publish-ios:
    if: startsWith(github.ref, 'refs/tags/simple_query_ios-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_query_ios

  publish-macos:
    if: startsWith(github.ref, 'refs/tags/simple_query_macos-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_query_macos

  publish-linux:
    if: startsWith(github.ref, 'refs/tags/simple_query_linux-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_query_linux

  publish-windows:
    if: startsWith(github.ref, 'refs/tags/simple_query_windows-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_query_windows

  publish-shared:
    if: startsWith(github.ref, 'refs/tags/simple_query_shared-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_query_shared
