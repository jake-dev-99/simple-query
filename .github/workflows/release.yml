name: Cut Release

# A manual cut authorizes one immutable batch. Scheduled runs only resume it.
# Publication remains in the original tag-push Deploy workflow for pub.dev OIDC.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Cut a new batch, resume an existing batch, or cancel remaining work'
        required: true
        default: cut
        type: choice
        options: [cut, resume, cancel]
      package:
        description: 'all selects changed packages and affected dependents'
        required: true
        default: all
        type: choice
        options:
          - all
          - simple_query
          - simple_query_platform_interface
          - simple_query_android
          - simple_query_ios
          - simple_query_macos
          - simple_query_linux
          - simple_query_windows
          - simple_query_shared
      bump:
        description: 'Apply this increment to each selected package'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: 'Preview and validate without writing release state or pushing'
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release-batch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cut-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install release tooling
        run: python3 -m pip install -r tool/release-requirements.txt

      - name: Coordinate batch release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            args=(--operation resume --scheduled)
          else
            args=(--operation "${OPERATION:-cut}" --package "${PACKAGE:-all}" --bump "${BUMP:-patch}")
            if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          fi
          python3 tool/release_coordinator.py "${args[@]}"
