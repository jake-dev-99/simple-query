name: simple_query
description: Cross-platform typed query API for device data (contacts, media, files, calendar, messages, calls).
version: 0.6.0
homepage: https://github.com/simplezen/simple-query
repository: https://github.com/simplezen/simple-query
issue_tracker: https://github.com/simplezen/simple-query/issues

topics:
  - flutter
  - plugin
  - contacts
  - query
  - files

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  # Hosted constraints for `pub publish`. Path overrides for
  # local development live in `pubspec_overrides.yaml` (which
  # pub publish ignores). Path-source deps inside this block
  # would fail validation with "Don't depend on X from the
  # path source."
  simple_query_platform_interface: ^0.6.0
  simple_query_android: ^0.6.0
  simple_query_ios: ^0.6.0
  simple_query_macos: ^0.6.0
  simple_query_linux: ^0.6.0
  simple_query_windows: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        default_package: simple_query_android
      ios:
        default_package: simple_query_ios
      macos:
        default_package: simple_query_macos
      linux:
        default_package: simple_query_linux
      windows:
        default_package: simple_query_windows
