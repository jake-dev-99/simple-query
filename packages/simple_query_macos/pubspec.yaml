name: simple_query_macos
description: macOS implementation for the simple_query federated plugin.
version: 0.3.0
homepage: https://github.com/simplezen/simple-query
repository: https://github.com/simplezen/simple-query
issue_tracker: https://github.com/simplezen/simple-query/issues

topics:
  - flutter
  - plugin
  - contacts
  - query
  - files

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
  simple_query_platform_interface: ^0.2.0
  simple_query_shared: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  pigeon: 30.0.4

flutter:
  plugin:
    implements: simple_query
    platforms:
      macos:
        pluginClass: SimpleQueryMacosPlugin
        dartPluginClass: SimpleQueryMacos
